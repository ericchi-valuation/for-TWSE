name: Monthly Revenue Auto Update

on:
  schedule:
    # 每月 11 號凌晨 0 點執行 (營收通常 10 號前公布完畢)
    # 0 16 10 * * UTC = 0:00 11th local time (assuming UTC+8)
    - cron: '0 16 10 * *' 
  workflow_dispatch: # 允許手動點擊執行

jobs:
  update-revenue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas FinMind pyarrow

      - name: Run Update Script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_monthly_rev.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tw_monthly_rev.parquet tw_historical_mr.csv
          git commit -m "Auto-update monthly revenue [skip ci]" || echo "No changes to commit"
          git push
